spring:
  application:
    name: job-posting-service


  datasource:
      url: jdbc:postgresql://localhost:5433/pickbit_job_db
      username: pickbit_user
      password: pickbit_pass_2024

  data:
    redis:
      host: localhost
      port: 6380

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 100
        order_inserts: true

  sql:
    init:
      mode: always
      schema-locations: classpath:sql/view-history-constraint.sql
      # DO 블록 내부 세미콜론과 구분하기 위한 문장 구분자 (스크립트 각 문장은 ";;" 로 종료)
      separator: ";;"

scheduler:
  job-posting:
    fixed-rate: 300000
  view-history:
    fixed-rate: 1000
  main-page:
    fixed-rate: 600000